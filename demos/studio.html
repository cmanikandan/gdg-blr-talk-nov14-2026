<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Interactive Stage Command Center for The Periodic Table of Agents — DevFest Bengaluru 2026 Keynote by Mani, Principal Architect, Google Cloud." />
  <title>The Periodic Table of Agents — Interactive Stage Command Center</title>
  <style>
    :root {
      --bg: #0B101B;
      --bg-elevated: #0E1524;
      --surface: #121A2B;
      --surface-alt: #182236;
      --surface-hover: #1E2B44;
      --border: #25334D;
      --border-strong: #34476B;
      --text: #F1F5F9;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --blue: #4285F4;
      --blue-soft: rgba(66, 133, 244, 0.15);
      --green: #34A853;
      --green-soft: rgba(52, 168, 83, 0.15);
      --amber: #F59E0B;
      --amber-soft: rgba(245, 158, 11, 0.15);
      --red: #EA4335;
      --red-soft: rgba(234, 67, 53, 0.15);
      --cyan: #38BDF8;
      --font-sans: 'Inter', 'Segoe UI', system-ui, -apple-system, 'DejaVu Sans', sans-serif;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'SF Mono', 'DejaVu Sans Mono', monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      min-height: 100vh;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    body:not(.record-mode) {
      background: radial-gradient(circle at 15% 0%, #121E36 0%, #0B101B 48%);
      overflow-y: auto;
      overflow-x: hidden;
    }

    /* ── Interactive Chrome (100% hidden when ?record=1) ── */
    body.record-mode .interactive-only {
      display: none !important;
    }

    .top-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(8, 12, 21, 0.94);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .stage-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 46px;
      padding: 7px 24px;
      border-bottom: 1px solid rgba(37, 51, 77, 0.65);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      font-weight: 700;
      font-size: 13px;
      letter-spacing: 0.04em;
      color: var(--text);
      white-space: nowrap;
      flex-shrink: 0;
    }
    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--blue);
      flex-shrink: 0;
    }
    .brand span { color: var(--blue); }
    .brand-sub {
      font-weight: 500;
      font-size: 11.5px;
      color: var(--text-muted);
      letter-spacing: 0.01em;
    }

    .health-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: nowrap;
      justify-content: flex-end;
    }

    .status-chip {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 11.5px;
      color: var(--text-muted);
      white-space: nowrap;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
    }
    .status-dot.green { background: var(--green); }
    .status-dot.amber { background: var(--amber); }
    .status-dot.blue { background: var(--blue); }
    .status-dot.red { background: var(--red); }

    .auto-reset-toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      white-space: nowrap;
    }
    .auto-reset-toggle input {
      accent-color: var(--green);
      width: 14px;
      height: 14px;
      cursor: pointer;
    }

    .reset-menu-wrap {
      position: relative;
    }
    .reset-popover {
      display: none;
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      width: 310px;
      background: #0F1729;
      border: 1px solid var(--border-strong);
      border-radius: 10px;
      padding: 10px;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.55);
      z-index: 60;
      flex-direction: column;
      gap: 8px;
    }
    .reset-popover.open { display: flex; }
    .reset-option {
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: 100%;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .reset-option:hover {
      background: var(--surface-hover);
      border-color: var(--blue);
    }
    .reset-option strong {
      font-size: 12.5px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .reset-option span {
      font-size: 11.5px;
      color: var(--text-muted);
      line-height: 1.38;
    }

    /* Second Navigation Row: Demo Tabs + Action Controls */
    .demo-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 8px 24px;
      background: rgba(13, 20, 34, 0.96);
      flex-wrap: wrap;
    }

    .tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }
    .tab-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 7px 12px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    .tab-btn:hover { color: var(--text); border-color: #3E5378; background: rgba(255,255,255,0.03); }
    .tab-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    .ctrl-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 13px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      white-space: nowrap;
    }
    .ctrl-btn:hover:not(:disabled) {
      background: var(--surface-hover);
      border-color: var(--border-strong);
    }
    .ctrl-btn.primary {
      background: var(--green);
      border-color: var(--green);
      color: #04190B;
      font-weight: 700;
    }
    .ctrl-btn.primary:hover:not(:disabled) {
      background: #40BC61;
      border-color: #40BC61;
    }
    .ctrl-btn.danger {
      background: var(--red);
      border-color: var(--red);
      color: #fff;
    }
    .ctrl-btn.info-active {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: #93C5FD;
    }
    .ctrl-btn:disabled { opacity: 0.42; cursor: not-allowed; }

    /* ── Live SSE Progress Drawer ── */
    .live-drawer {
      display: none;
      margin: 14px 28px 0 28px;
      background: #0F1729;
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 16px 20px;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.35);
    }
    .live-drawer.visible { display: flex; }
    .live-drawer.done { border-color: rgba(52, 168, 83, 0.65); }
    .live-drawer.err { border-color: rgba(234, 67, 53, 0.7); }

    .live-drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .live-title {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 14.5px;
      color: var(--text);
    }
    .spinner {
      width: 14px;
      height: 14px;
      border: 2px solid rgba(66, 133, 244, 0.25);
      border-top-color: var(--blue);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .stepper {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .step-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 6px 11px;
      border-radius: 7px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-family: var(--font-mono);
      font-size: 12px;
      color: var(--text-dim);
      transition: all 0.2s ease;
    }
    .step-pill.active {
      background: var(--blue-soft);
      border-color: var(--blue);
      color: #BFDBFE;
      font-weight: 600;
    }
    .step-pill.done {
      background: var(--green-soft);
      border-color: rgba(52, 168, 83, 0.6);
      color: #86EFAC;
    }

    .live-feed {
      background: #080C15;
      border: 1px solid #1E2B42;
      border-radius: 8px;
      padding: 10px 14px;
      max-height: 120px;
      overflow-y: auto;
      font-family: var(--font-mono);
      font-size: 12px;
      line-height: 1.5;
      color: #CBD5E1;
    }
    .live-feed-line {
      display: flex;
      gap: 10px;
    }
    .live-feed-ts {
      color: var(--text-dim);
      flex-shrink: 0;
      min-width: 52px;
    }

    /* ── Behind the Scenes Architecture Drawer ── */
    .bts-drawer {
      display: none;
      margin: 14px 28px 0 28px;
      background: linear-gradient(180deg, #111B2E 0%, #0E1626 100%);
      border: 1px solid var(--border-strong);
      border-radius: 12px;
      padding: 18px 22px;
      flex-direction: column;
      gap: 14px;
    }
    .bts-drawer.open { display: flex; }
    .bts-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .bts-heading {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: #7BB1FF;
    }
    .bts-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
    }
    .bts-card {
      background: rgba(11, 16, 27, 0.72);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 13px 15px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .bts-card-label {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
    }
    .bts-card-label.green { color: #6CE08A; }
    .bts-card-label.amber { color: #FBBF24; }
    .bts-card-label.blue { color: #7BB1FF; }
    .bts-card-body {
      font-size: 13px;
      line-height: 1.5;
      color: #DCE6F4;
    }

    /* ── Toast Notification ── */
    .toast-wrap {
      position: fixed;
      right: 24px;
      bottom: 22px;
      z-index: 80;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      pointer-events: auto;
      background: #101A2C;
      border: 1px solid var(--border-strong);
      border-left: 4px solid var(--green);
      color: var(--text);
      padding: 12px 16px;
      border-radius: 9px;
      font-size: 13px;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.5);
      max-width: 420px;
      line-height: 1.45;
    }
    .toast.err { border-left-color: var(--red); }
    .toast strong { display: block; margin-bottom: 2px; }

    /* ── Main 1920x1080 Cinema Canvas (record-mode) & Responsive Interactive Stage ── */
    .canvas {
      width: 1920px;
      height: 1080px;
      padding: 36px 52px 34px 52px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      transform-origin: top left;
    }
    body:not(.record-mode) .canvas {
      width: 100%;
      max-width: 1760px;
      margin: 0 auto;
      height: auto;
      min-height: calc(100vh - 108px);
      padding: 18px 28px 28px 28px;
      gap: 16px;
    }

    /* Scene Header */
    .scene-header {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 16px;
      flex-shrink: 0;
      gap: 16px;
    }
    .scene-kicker {
      font-family: var(--font-mono);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--blue);
      margin-bottom: 6px;
    }
    .scene-title {
      font-size: 29px;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.15;
    }
    .scene-meta {
      display: flex;
      gap: 22px;
      align-items: center;
      flex-shrink: 0;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text-muted);
    }
    .meta-stat { white-space: nowrap; }
    .meta-stat strong {
      color: var(--text);
      font-size: 17px;
      margin-left: 6px;
    }
    .meta-stat.green strong { color: var(--green); }
    .meta-stat.amber strong { color: var(--amber); }

    /* Panels */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 22px 26px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      overflow: hidden;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-family: var(--font-mono);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      border-bottom: 1px solid rgba(37, 51, 77, 0.7);
      padding-bottom: 10px;
    }
    .tag {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 5px;
      letter-spacing: 0.03em;
      white-space: nowrap;
    }
    .tag-blue { background: var(--blue-soft); color: #7BB1FF; }
    .tag-green { background: var(--green-soft); color: #6CE08A; }
    .tag-amber { background: var(--amber-soft); color: #FBBF24; }
    .tag-red { background: var(--red-soft); color: #F87171; }

    /* Grid utilities */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 22px; flex: 1; min-height: 0; }
    .grid-42-58 { display: grid; grid-template-columns: 42fr 58fr; gap: 22px; flex: 1; min-height: 0; }
    .grid-60-40 { display: grid; grid-template-columns: 60fr 40fr; gap: 22px; flex: 1; min-height: 0; }
    .grid-46-54 { display: grid; grid-template-columns: 46fr 54fr; gap: 22px; flex: 1; min-height: 0; }
    .col-stack { display: flex; flex-direction: column; gap: 18px; min-height: 0; }

    /* Typography & Code */
    .prose { font-size: 17px; line-height: 1.5; color: #CBD5E1; }
    .code-box {
      background: #080C15;
      border: 1px solid #1E2B42;
      border-radius: 8px;
      padding: 12px 14px;
      font-family: var(--font-mono);
      font-size: 13.5px;
      line-height: 1.48;
      color: #DCE8FA;
      white-space: pre-wrap;
      overflow: hidden;
    }
    body:not(.record-mode) .code-box {
      overflow-x: auto;
    }

    /* Worker rows (Demo 1) */
    .worker-card {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 15px 18px;
      display: flex;
      flex-direction: column;
      gap: 9px;
      transition: opacity 0.25s ease;
    }
    .worker-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .worker-id {
      font-family: var(--font-mono);
      font-weight: 700;
      font-size: 16px;
      color: var(--text);
    }
    .worker-branch {
      font-family: var(--font-mono);
      font-size: 13px;
      color: var(--cyan);
    }
    .worker-metrics {
      font-family: var(--font-mono);
      font-size: 13.5px;
      color: var(--green);
      font-weight: 600;
    }

    /* Footer command strip */
    .cmd-strip {
      background: #0D1524;
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-shrink: 0;
    }
    .cmd-strip.amber { border-left-color: var(--amber); }
    .cmd-strip.green { border-left-color: var(--green); }
    .cmd-text {
      font-family: var(--font-mono);
      font-size: 16px;
      color: #E2E8F0;
    }
    .cmd-text .prompt { color: var(--green); margin-right: 10px; }

    /* Tables */
    table.data-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15.5px;
    }
    table.data-table th {
      text-align: left;
      font-family: var(--font-mono);
      font-size: 12.5px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
    }
    table.data-table td {
      padding: 11px 12px;
      border-bottom: 1px solid rgba(37, 51, 77, 0.55);
      vertical-align: middle;
    }
    table.data-table td.num, table.data-table th.num {
      text-align: right;
      font-family: var(--font-mono);
    }
    table.data-table tr.hidden-row { opacity: 0.08; }

    /* Horizontal Race Bars (Demo 2 & Demo 4) */
    .bar-group { display: flex; flex-direction: column; gap: 11px; }
    .bar-item { display: flex; flex-direction: column; gap: 5px; }
    .bar-label-row {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      font-size: 15px;
      font-family: var(--font-mono);
    }
    .bar-track {
      height: 24px;
      background: #0A0F1A;
      border-radius: 6px;
      overflow: hidden;
      border: 1px solid #1E293B;
    }
    .bar-fill {
      height: 100%;
      border-radius: 5px;
      display: flex;
      align-items: center;
      padding-left: 10px;
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      color: #06101B;
      white-space: nowrap;
    }
    .bar-green { background: var(--green); color: #051A0D; }
    .bar-blue { background: var(--blue); color: #FFFFFF; }
    .bar-amber { background: var(--amber); color: #1A1102; }
    .bar-red { background: var(--red); color: #FFFFFF; }

    /* Voice Waveform (Demo 3) */
    .wave-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      height: 76px;
      background: #080C15;
      border: 1px solid #1E2B42;
      border-radius: 10px;
      padding: 10px 18px;
    }
    .wave-bar {
      width: 6px;
      border-radius: 4px;
      background: var(--blue);
      min-height: 6px;
    }
    .transcript-bubble {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .transcript-bubble.gemini { border-left-color: var(--green); }
    .transcript-speaker {
      font-family: var(--font-mono);
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
    }
    .transcript-text {
      font-size: 17px;
      line-height: 1.45;
      color: var(--text);
    }

    /* ADK DAG Nodes (Demo 3) */
    .dag-list { display: flex; flex-direction: column; gap: 11px; }
    .dag-node {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      opacity: 0.25;
    }
    .dag-node.active { opacity: 1; border-color: var(--blue); background: #162238; }
    .dag-node.done { opacity: 1; border-color: rgba(52, 168, 83, 0.55); }
    .dag-node.hitl { opacity: 1; border-color: var(--amber); background: rgba(245, 158, 11, 0.11); }
    .dag-name { font-family: var(--font-mono); font-size: 15px; font-weight: 700; color: var(--text); }
    .dag-detail { font-size: 14.5px; color: #CBD5E1; margin-top: 3px; }

    /* Big KPI Stat */
    .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
    .kpi-box {
      background: var(--surface-alt);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px 18px;
    }

  <script>

    function esc(str) {
      return String(str ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    function clamp01(v) { return Math.max(0, Math.min(1, v)); }

    function easeOut(v) {
      const c = clamp01(v);
      return 1 - Math.pow(1 - c, 3);
    }

    function typewriter(str, progress) {
      const s = String(str || '');
      return s.slice(0, Math.floor(s.length * clamp01(progress)));
    }

    function trimWords(str, maxLen) {
      const s = String(str || '').trim();
      if (s.length <= maxLen) return s;
      const cut = s.slice(0, maxLen);
      const lastSpace = cut.lastIndexOf(' ');
      return (lastSpace > maxLen * 0.6 ? cut.slice(0, lastSpace) : cut) + '…';
    }

    // ── SCENE 1: Carbon Architect -> Parallel Hydrogen `/swarm` -> Remote Agent ──
    function renderScene1(t) {
      const d = TRACES.demo1;
      if (!d) return '<div class="panel">Loading Demo 1 real trace...</div>';

      const carb = d.carbon_architect;
      const swarm = d.hydrogen_swarm;
      const plan = carb.plan || {};
      const workers = swarm.workers || [];

      const pCarbon = easeOut(t / 3.8);
      const pRisk = easeOut((t - 2.0) / 2.2);
      const showSwarm = t >= 4.2;
      const showFooter = t >= 9.6;

      const workerCards = workers.map((w, idx) => {
        const startT = 4.3 + idx * 0.45;
        const doneT = startT + 2.4 + idx * 0.6;
        const vis = clamp01((t - startT) / 0.5);
        const done = t >= doneT;
        const codeProg = clamp01((t - startT - 0.3) / 2.6);
        const preview = (w.artifact_preview || '').split('\n').slice(0, 5).join('\n');
        return `
          <div class="worker-card" style="opacity:${vis}">
            <div class="worker-top">
              <div>
                <span class="worker-id">${esc(w.worker_id)} · ${esc(w.owner)}</span>
                <span class="worker-branch" style="margin-left:12px;">${esc(w.branch)}</span>
              </div>
              <div style="display:flex;gap:10px;align-items:center;flex-shrink:0;">
                <span class="tag tag-blue">${esc(w.model)} (${esc(w.thinking_level)})</span>
                <span class="worker-metrics">${done ? `${w.latency_ms} ms · ${w.artifact_lines}L` : 'executing in worktree...'}</span>
              </div>
            </div>
            <div class="code-box" style="font-size:12.5px;line-height:1.45;">${esc(typewriter(preview, codeProg))}</div>
          </div>
        `;
      }).join('');

      return `
        <div class="scene-header">
          <div>
            <div class="scene-kicker">DEMO 01 · PLAN BIG, EXECUTE FAST · REAL GEMINI 4 API + ISOLATED GIT WORKTREES</div>
            <div class="scene-title">Plan Big with Carbon · Execute Fast with Parallel Hydrogen <code>/swarm</code></div>
          </div>
          <div class="scene-meta">
            <div class="meta-stat">Carbon Plan<strong>${(carb.latency_ms / 1000).toFixed(1)}s</strong></div>
            <div class="meta-stat green">Swarm Wall<strong>${(swarm.wall_clock_ms / 1000).toFixed(2)}s</strong></div>
            <div class="meta-stat amber">Speedup<strong>${swarm.parallel_speedup}x</strong></div>
          </div>
        </div>

        <div class="grid-42-58">
          <div class="panel">
            <div class="panel-header">
              <span>PHASE 1 · GEMINI 4 CARBON ARCHITECT</span>
              <span class="tag tag-blue">${carb.usage.input_tokens} in · ${carb.usage.output_tokens} out tok</span>
            </div>
            <div class="prose" style="color:#E2E8F0;">
              ${esc(typewriter(plan.architecture_summary || '', pCarbon))}
            </div>
            <div style="margin-top:6px;opacity:${pRisk}">
              <div style="font-family:var(--font-mono);font-size:13px;font-weight:700;color:var(--amber);margin-bottom:8px;letter-spacing:0.05em;">

              </div>
              <div class="code-box" style="line-height:1.52;color:#FDE68A;border-color:rgba(245,158,11,0.35);">${esc(trimWords(plan.risk_assessment || '', 440))}</div>
            </div>
            <div style="margin-top:auto;display:flex;justify-content:space-between;font-family:var(--font-mono);font-size:13px;color:var(--text-muted);padding-top:10px;border-top:1px solid var(--border);">
              <span>Worktree Isolation: <strong style="color:#E2E8F0;">git worktree add --detach</strong></span>
              <span>Conflicts: <strong style="color:var(--green);">0</strong></span>
            </div>
          </div>

          <div class="panel">
            <div class="panel-header">
              <span>PHASE 2 · PARALLEL GEMINI 4 HYDROGEN /SWARM (3 WORKTREES)</span>
              <span class="tag tag-green">${showSwarm ? `${swarm.wall_clock_ms} ms wall vs ${swarm.sequential_sum_ms} ms seq` : 'Waiting for Carbon plan...'}</span>
            </div>
            <div class="col-stack" style="gap:13px;flex:1;">
              ${workerCards}
            </div>
          </div>
        </div>

        <div class="cmd-strip ${showFooter ? 'green' : ''}" style="opacity:${showFooter ? 1 : 0.15}">
          <div class="cmd-text">
            <span class="prompt">$</span>${esc(d.remote_agent_cmd)}
          </div>
          <div style="display:flex;gap:12px;align-items:center;flex-shrink:0;">
            <span class="tag tag-green">pytest: ${esc(d.pytest_verification.summary)}</span>

          </div>
        </div>
      `;
    }

    // ── SCENE 2: Decisions API Arena (4 Events + Live Flash/Hydrogen Race + Multimodal) ──
    function renderScene2(t) {
      const d = TRACES.demo2;
      if (!d) return '<div class="panel">Loading Demo 2 real trace...</div>';

      const evs = d.round_a_four_events || [];
      const b8 = d.round_b_head_to_head.benchmark_8q || [];
      const b50 = d.round_b_head_to_head.benchmark_50q || [];
      const pub100 = d.round_b_head_to_head.published_100q_reference;
      const mm = d.round_c_multimodal;

      const rowsHtml = evs.map((ev, i) => {
        const show = t >= (0.6 + i * 0.95);
        let badgeCls = 'tag-green';
        if (ev.adk_route === 'quarantine') badgeCls = 'tag-red';
        else if (ev.adk_route === 'dlp_redact') badgeCls = 'tag-amber';
        else if (ev.adk_route === 'lakehouse_carbon' || ev.adk_route === 'multicloud_carbon') badgeCls = 'tag-blue';
        return `
          <tr class="${show ? '' : 'hidden-row'}">
            <td><strong>${esc(ev.id)}</strong> · ${esc(ev.label)}</td>
            <td><span class="tag ${badgeCls}">${esc(ev.verdict)}</span></td>
            <td style="font-family:var(--font-mono);color:#CBD5E1;">${esc(ev.selected_model)}</td>
            <td class="num">${ev.injection_prob.toFixed(2)} / ${ev.secret_prob.toFixed(2)}</td>
            <td class="num" style="color:var(--green);font-weight:700;">${ev.latency_ms} ms</td>
            <td class="num" style="color:var(--green);font-weight:700;">${ev.output_tokens}</td>
          </tr>
        `;
      }).join('');

      const raceProg = easeOut((t - 5.2) / 3.2);

        <div class="cmd-strip green" style="opacity:${showFooter ? 1 : 0.15}">

      `;
    }

    // ── SCENE 6: Mani's Real Voice AI Recordings Showcase (Interactive Stage Tab) ──
    function renderScene6() {
      return `
        <div class="scene-header">
          <div>
            <div class="scene-kicker">DEMO 06 · GEMINI 3.8 LIVE &amp; VOICEAI · REAL RECORDED MULTIMODAL &amp; INDIAN TELEPHONY DEMOS</div>

        <div class="grid-2">

    window.renderDemoAt = function (sceneId, t) {
      currentScene = sceneId;
      const stage = document.getElementById('stage');
      if (sceneId === 1) stage.innerHTML = renderScene1(t);
      else if (sceneId === 2) stage.innerHTML = renderScene2(t);
      else if (sceneId === 3) stage.innerHTML = renderScene3(t);
      else if (sceneId === 4) stage.innerHTML = renderScene4(t);
      else if (sceneId === 5) stage.innerHTML = renderScene5(t);
      else if (sceneId === 6) stage.innerHTML = renderScene6();
    };

    function stopPlayback() {
      if (rafId) cancelAnimationFrame(rafId);
      rafId = null;
      audioTimers.forEach(id => clearTimeout(id));
      audioTimers = [];
      liveAudios.forEach(a => { try { a.pause(); a.currentTime = 0; } catch {} });
      liveAudios = [];
    }

    function playInteractive(sceneId) {
      stopPlayback();
      if (sceneId === 6) {
        window.renderDemoAt(6, 0);
        return;
      }

      const durations = { 1: 14.0, 2: 16.0, 3: 44.0, 4: 14.0, 5: 14.5 };
      if (sceneId === 3 && TRACES.demo3?.voice_turns?.length) {
        const vt = TRACES.demo3.voice_turns;
        const d1 = vt[0]?.duration_sec || 8.3;
        const d2 = vt[1]?.duration_sec || 10.0;
        const d3 = vt[2]?.duration_sec || 24.3;
        durations[3] = d1 + d2 + d3 + 1.5;

        if (!IS_RECORD_MODE && audioEnabled) {
          const schedule = [
            { delayMs: 200, url: `/traces/audio/turn1_mani_checkin.wav?v=${audioBust}` },
            { delayMs: (d1 + 0.55) * 1000, url: `/traces/audio/turn2_gemini_ack.wav?v=${audioBust}` },
            { delayMs: (d1 + d2 + 0.90) * 1000, url: `/traces/audio/turn3_gemini_report.wav?v=${audioBust}` },
          ];
          schedule.forEach(item => {
            const a = new Audio(item.url);
            liveAudios.push(a);
            const tid = setTimeout(() => {
              if (audioEnabled && liveAudios.includes(a)) {
                a.play().catch(() => {});
              }
            }, item.delayMs);
            audioTimers.push(tid);
          });
        }
      }

      const dur = durations[sceneId] || 14.0;
      const t0 = performance.now();
      function step(now) {
        const elapsed = (now - t0) / 1000;
        window.renderDemoAt(sceneId, Math.min(elapsed, dur));
        if (elapsed < dur) rafId = requestAnimationFrame(step);
      }
      rafId = requestAnimationFrame(step);
    }

    // ── Interactive Stage Command Center Logic (disabled in ?record=1) ──
    if (!IS_RECORD_MODE) {
      const btnRunLive = document.getElementById('btnRunLive');
      const btnReplay = document.getElementById('btnReplay');
      const btnAudioToggle = document.getElementById('btnAudioToggle');
      const btnBtsToggle = document.getElementById('btnBtsToggle');
      const btsDrawer = document.getElementById('btsDrawer');
      const liveDrawer = document.getElementById('liveDrawer');
      const liveSpinner = document.getElementById('liveSpinner');
      const liveTitleText = document.getElementById('liveTitleText');
      const liveTimer = document.getElementById('liveTimer');
      const liveStepper = document.getElementById('liveStepper');
      const liveFeed = document.getElementById('liveFeed');
      const btnHideLiveDrawer = document.getElementById('btnHideLiveDrawer');
      const chkAutoReset = document.getElementById('chkAutoReset');
      const btnResetMenu = document.getElementById('btnResetMenu');
      const resetPopover = document.getElementById('resetPopover');
      const btnQuickReset = document.getElementById('btnQuickReset');
      const btnFactoryReset = document.getElementById('btnFactoryReset');
      const toastWrap = document.getElementById('toastWrap');

      function showToast(title, detail, isErr = false) {
        const el = document.createElement('div');
        el.className = `toast ${isErr ? 'err' : ''}`;
        el.innerHTML = `<strong>${esc(title)}</strong><div>${esc(detail)}</div>`;
        toastWrap.appendChild(el);
        setTimeout(() => {
          el.style.transition = 'opacity 0.25s';
          el.style.opacity = '0';
          setTimeout(() => el.remove(), 260);
        }, 4200);
      }

      function updateStatusUI(st) {
        if (!st) return;
        liveKeyConfigured = Boolean(st.live_key_configured);
        const apiDot = document.getElementById('apiDot');
        const apiText = document.getElementById('apiText');
        if (liveKeyConfigured) {
          apiDot.className = 'status-dot green';
          apiText.textContent = 'Gemini API: LIVE';
        } else {
          apiDot.className = 'status-dot amber';
          apiText.textContent = 'Replay Mode';
        }

        const backendDot = document.getElementById('backendDot');
        const backendText = document.getElementById('backendText');
        const backendChip = document.getElementById('backendChip');
        if (st.backend_clean) {
          backendDot.className = 'status-dot green';
          backendText.textContent = `Backend: CLEAN (${(st.spanner_rows/1000).toFixed(0)}k/${(st.iceberg_rows/1000).toFixed(0)}k)`;
          backendChip.title = `Clean: ${st.spanner_rows.toLocaleString()} Spanner Omni rows · ${st.iceberg_rows.toLocaleString()} BigQuery Iceberg rows · 0 stale worktrees`;
        } else {
          backendDot.className = 'status-dot amber';
          backendText.textContent = `Backend: Reset Needed`;
          backendChip.title = `Stale worktrees: ${st.stale_worktrees} · Modified code files: ${(st.modified_code_files||[]).length}`;
        }

        syncControlsForScene(currentScene);
      }

      function renderBtsDrawer(sceneId) {
        const info = BEHIND_THE_SCENES[sceneId];
        if (!info) return;
        btsDrawer.innerHTML = `
          <div class="bts-top">
            <span class="bts-heading">BEHIND THE SCENES · ${esc(info.title)}</span>
            <button class="ctrl-btn" id="btnCloseBts" type="button" style="padding:4px 10px;font-size:11.5px;">Close ✕</button>
          </div>
          <div class="bts-grid">
            <div class="bts-card">
              <div class="bts-card-label">1. The Business Scenario</div>
              <div class="bts-card-body">${esc(info.scenario)}</div>
            </div>
            <div class="bts-card">
              <div class="bts-card-label green">2. What Executes LIVE</div>
              <div class="bts-card-body">${esc(info.live)}</div>
            </div>
            <div class="bts-card">
              <div class="bts-card-label amber">3. Local Stage Fixtures</div>
              <div class="bts-card-body">${esc(info.local)}</div>
            </div>
            <div class="bts-card">
              <div class="bts-card-label blue">4. Keynote Punchline</div>
              <div class="bts-card-body" style="font-style:italic;color:#F1F5F9;">${esc(info.takeaway)}</div>
            </div>
          </div>
        `;
        const closeBtn = document.getElementById('btnCloseBts');
        if (closeBtn) closeBtn.addEventListener('click', () => setBtsOpen(false));
      }

      function setBtsOpen(open) {
        btsOpen = open;
        btsDrawer.classList.toggle('open', btsOpen);
        btnBtsToggle.classList.toggle('info-active', btsOpen);
        if (btsOpen) renderBtsDrawer(currentScene);
      }

      function syncControlsForScene(sceneId) {
        const isVoiceShowcase = sceneId === 6;
        const isRunning = Boolean(activeEventSource);
        btnAudioToggle.style.display = sceneId === 3 ? 'inline-flex' : 'none';
        btnReplay.style.display = isVoiceShowcase ? 'none' : 'inline-flex';
        btnRunLive.style.display = isVoiceShowcase ? 'none' : 'inline-flex';
        if (!isRunning) {
          btnRunLive.className = 'ctrl-btn primary';
          btnRunLive.textContent = '⚡ Run LIVE';
          btnRunLive.disabled = !liveKeyConfigured;
          btnRunLive.title = liveKeyConfigured
            ? 'Execute this demo live against Google Gemini APIs right from the browser'
            : 'Export GEMINI_API_KEY in your terminal before launching stage_workbench.py to enable live runs';
        }
      }

      function switchScene(sceneId) {
        currentScene = sceneId;
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.toggle('active', Number(b.dataset.scene) === sceneId);
        });
        syncControlsForScene(sceneId);
        if (btsOpen) renderBtsDrawer(sceneId);
        playInteractive(sceneId);
      }

      function renderStepper(steps, activeIdx, allDone = false) {
        liveStepper.innerHTML = steps.map((label, idx) => {
          let cls = '';
          let icon = `${idx + 1}.`;
          if (allDone || idx < activeIdx) { cls = 'done'; icon = '✔'; }
          else if (idx === activeIdx) { cls = 'active'; icon = '▶'; }
          return `<div class="step-pill ${cls}"><span>${icon}</span><span>${esc(label)}</span></div>`;
        }).join('');
      }

      function appendLiveLine(line, elapsedMs) {
        const row = document.createElement('div');
        row.className = 'live-feed-line';
        const sec = (elapsedMs / 1000).toFixed(1).padStart(5, ' ') + 's';
        row.innerHTML = `<span class="live-feed-ts">${esc(sec)}</span><span>${esc(line)}</span>`;
        liveFeed.appendChild(row);
        liveFeed.scrollTop = liveFeed.scrollHeight;
      }

      function cleanupLiveStream() {
        if (activeEventSource) {
          activeEventSource.close();
          activeEventSource = null;
        }
        if (liveTimerInterval) {
          clearInterval(liveTimerInterval);
          liveTimerInterval = null;
        }
        syncControlsForScene(currentScene);
      }

      function startLiveStream(sceneId) {
        const demoId = SCENE_TO_DEMO_ID[sceneId];
        if (!demoId) return;

        stopPlayback();
        cleanupLiveStream();

        const autoReset = chkAutoReset.checked ? 1 : 0;
        const url = `/api/stream/${demoId}?auto_reset=${autoReset}`;

        liveDrawer.className = 'live-drawer interactive-only visible';
        liveSpinner.style.display = 'inline-block';
        liveTitleText.textContent = `Starting live ${demoId}...`;
        liveStepper.innerHTML = '';
        liveFeed.innerHTML = '';
        liveTimer.textContent = '0.0s';

        btnRunLive.className = 'ctrl-btn danger';
        btnRunLive.textContent = '■ Cancel Live Run';
        btnRunLive.disabled = false;

        let steps = [];
        let currentStep = 0;
        const startTime = performance.now();
        liveTimerInterval = setInterval(() => {
          liveTimer.textContent = `${((performance.now() - startTime) / 1000).toFixed(1)}s`;
        }, 100);

        const es = new EventSource(url);
        activeEventSource = es;

        es.addEventListener('start', (e) => {
          const d = JSON.parse(e.data);
          steps = d.steps || [];
          currentStep = 0;
          liveTitleText.textContent = `LIVE · ${d.title}`;
          renderStepper(steps, 0, false);
          appendLiveLine(`Connected to live runner (${demoId}, auto_reset=${d.auto_reset ? 'ON' : 'OFF'})`, 0);
        });

        es.addEventListener('phase', (e) => {
          const d = JSON.parse(e.data);
          currentStep = d.step_index;
          renderStepper(steps, currentStep, false);
        });

        es.addEventListener('log', (e) => {
          const d = JSON.parse(e.data);
          appendLiveLine(d.line, d.elapsed_ms || 0);
        });

        es.addEventListener('trace', (e) => {
          const d = JSON.parse(e.data);
          TRACES[d.demo_id] = d.trace;
          if (d.audio_bust) audioBust = d.audio_bust;
          appendLiveLine(`Fresh live trace captured for ${d.demo_id} — rendering visual stage!`, performance.now() - startTime);
        });

        es.addEventListener('reset', (e) => {
          const r = JSON.parse(e.data);
          appendLiveLine(`Auto-Reset complete in ${r.elapsed_ms}ms: ${(r.actions || []).join(' · ')}`, performance.now() - startTime);
          updateStatusUI(r.status);
        });

        es.addEventListener('done', (e) => {
          const d = JSON.parse(e.data);
          cleanupLiveStream();
          liveSpinner.style.display = 'none';
          liveDrawer.classList.add('done');
          renderStepper(steps, steps.length, true);
          const sec = (d.elapsed_ms / 1000).toFixed(1);
          liveTitleText.textContent = `✔ Live Run Complete (${sec}s)${d.auto_reset ? ' · Code & Backend Auto-Reset Clean' : ''}`;
          liveTimer.textContent = `${sec}s`;
          if (d.status) updateStatusUI(d.status);
          showToast(
            `Live ${d.demo_id.toUpperCase()} Complete (${sec}s)`,
            d.auto_reset
              ? 'Fresh live results rendered & backend auto-reset cleanly (10k Spanner · 40k Iceberg).'
              : 'Fresh live API results rendered on stage.'
          );
          if (SCENE_TO_DEMO_ID[currentScene] === d.demo_id) {
            playInteractive(currentScene);
          }
        });

        es.addEventListener('error', (e) => {
          let msg = 'Live stream interrupted or API error.';
          if (e && e.data) {
            try {
              const parsed = JSON.parse(e.data);
              msg = parsed.message || msg;
              if (parsed.status) updateStatusUI(parsed.status);
            } catch {}
          }
          cleanupLiveStream();
          liveSpinner.style.display = 'none';
          liveDrawer.classList.add('err');
          liveTitleText.textContent = `✖ Live Run Failed`;
          appendLiveLine(`ERROR: ${msg}`, performance.now() - startTime);
          showToast('Live Demo Error', msg, true);
        });
      }

      async function performReset({ restoreTraces = false, verifyTests = false }) {
        resetPopover.classList.remove('open');
        const backendDot = document.getElementById('backendDot');
        const backendText = document.getElementById('backendText');
        backendDot.className = 'status-dot blue';
        backendText.textContent = restoreTraces ? 'Factory Resetting...' : 'Resetting Backend...';
        btnResetMenu.disabled = true;

        try {
          const res = await fetch('/api/reset', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              reset_code: true,
              restore_traces: restoreTraces,
              verify_tests: verifyTests,
            }),
          });
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          updateStatusUI(data.status);
          if (restoreTraces && data.traces) {
            TRACES = data.traces;
            audioBust = data.audio_bust || Date.now();
            playInteractive(currentScene);
          }
          const summary = (data.actions || []).join(' · ');
          showToast(
            restoreTraces ? `Factory Reset Clean (${data.elapsed_ms}ms)` : `Code & Backend Reset (${data.elapsed_ms}ms)`,
            summary
          );
        } catch (err) {
          showToast('Reset Failed', err.message || String(err), true);
          fetch('/api/status').then(r => r.json()).then(updateStatusUI).catch(() => {});
        } finally {
          btnResetMenu.disabled = false;
        }
      }

      // Wire events
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => switchScene(Number(btn.dataset.scene)));
      });

      btnReplay.addEventListener('click', () => playInteractive(currentScene));

      btnRunLive.addEventListener('click', () => {
        if (activeEventSource) {
          cleanupLiveStream();
          liveSpinner.style.display = 'none';
          liveTitleText.textContent = 'Live Run Cancelled (pruning any worktrees...)';
          showToast('Live Run Cancelled', 'Cancelled stream cleanly.');
          fetch('/api/status').then(r => r.json()).then(updateStatusUI).catch(() => {});
        } else {
          startLiveStream(currentScene);
        }
      });

      btnAudioToggle.addEventListener('click', () => {
        audioEnabled = !audioEnabled;
        btnAudioToggle.textContent = audioEnabled ? '🔊 Audio: ON' : '🔇 Audio: OFF';
        if (!audioEnabled) {
          liveAudios.forEach(a => { try { a.pause(); } catch {} });
        } else if (currentScene === 3) {
          playInteractive(3);
        }
      });

      btnBtsToggle.addEventListener('click', () => setBtsOpen(!btsOpen));
      btnHideLiveDrawer.addEventListener('click', () => liveDrawer.classList.remove('visible'));

      btnResetMenu.addEventListener('click', (e) => {
        e.stopPropagation();
        resetPopover.classList.toggle('open');
      });
      document.addEventListener('click', (e) => {
        if (!resetPopover.contains(e.target) && e.target !== btnResetMenu) {
          resetPopover.classList.remove('open');
        }
      });
      btnQuickReset.addEventListener('click', () => performReset({ restoreTraces: false, verifyTests: false }));
      btnFactoryReset.addEventListener('click', () => performReset({ restoreTraces: true, verifyTests: true }));

      // Stage keyboard shortcuts (1-6 tabs, R replay, B behind the scenes)
      document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const tabOrder = [1, 5, 2, 3, 4, 6];
        if (e.key >= '1' && e.key <= '6') {
          switchScene(tabOrder[Number(e.key) - 1]);
        } else if (e.key.toLowerCase() === 'r') {
          playInteractive(currentScene);
        } else if (e.key.toLowerCase() === 'b') {
          setBtsOpen(!btsOpen);
        }
      });

      // Initial data hydration
      fetch('/api/traces')
        .then(r => r.json())
        .then(data => {
          TRACES = data.traces || {};
          if (data.audio_bust) audioBust = data.audio_bust;
          updateStatusUI(data.status || { live_key_configured: data.live_key_configured, backend_clean: true, spanner_rows: 10000, iceberg_rows: 40000 });
          switchScene(1);
        })
        .catch(() => {
          window.renderDemoAt(1, 12.0);
        });
    }
  </script>
