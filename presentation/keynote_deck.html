  <script>
    const SLIDES = [{"num": 1, "time": "00:00 \u2013 01:00", "theme": "dark-hero", "kicker": "DEVFEST 2026 KEYNOTE \u00b7 30-MINUTE LIVE BUILD", "title": "The Periodic Table of Agents", "subtitle": "Building with Gemini 4, Google Antigravity, ADK 2.0 & the Agentic Data Cloud", "pills": ["Plan Big (Carbon)", "Execute Fast (Hydrogen)", "Decide Small (Decision-1)", "Review Everything (Antigravity)"], "footer_left": "Manikandan (Mani) \u00b7 Principal Architect, Google Cloud", "footer_right": "github.com/cmanikandan/gdg-blr-talk-nov14-2026", "notes": "[00:00 - HIGH ENERGY WALK-ON] Good morning DevFest!! How many of you shipped code with an AI agent this week? Keep your hands up if you closed your laptop, got stuck in Bengaluru traffic, and your agent kept running tests, auditing security, and had a verified Pull Request waiting when you sat back down! Today\u2014zero slideware promises. In the next 30 minutes we are kicking off a real multi-cloud build in minute two, checking on it by voice mid-talk, and reviewing the shipped PR before the clock hits zero!"}, {"num": 2, "time": "01:00 \u2013 02:15", "theme": "head-first", "kicker": "THE 6-MONTH ARCHITECTURE SHIFT (+ FULL DISCLOSURE)", "title": "From Laptop Babysitter to Autonomous Cloud Squad", "image": "../assets/infographics/01_hf_badge_shift.jpg", "bullets": ["\ud83e\udeaa **Fresh Badge Disclaimer:** I'm so new to Google Cloud that the ink on my badge is still warm\u2014I used `gemini-4-hydrogen` just to find the micro-kitchen!", "\u23ea **Six Months Ago:** An AI agent was a smart pair programmer chained to 1 giant model and your open laptop.", "\u23e9 **Today:** One session **plans with Carbon**, **builds in parallel with Hydrogen**, and **ships in the cloud** after you close your lid.", "\ud83e\udded **The Mantra:** *Plan big, execute fast, decide small, and review everything.*"], "notes": "[01:00 - DELIVER THE BADGE WISE-CRACK WITH A BIG GRIN!] Quick confession before we touch live production code: I'm a Principal Architect at Google Cloud, and I am SO new to Google that I literally just got my badge! Seriously\u2014look at it, the lamination is still warm, my badge photo still has optimism in its eyes, and if this live demo blows up on stage, HR hasn't even replicated my manager hierarchy into Spanner yet! Six months ago, we were all babysitting one model prompt-by-prompt. Today, we orchestrate specialized elements."}, {"num": 3, "time": "02:15 \u2013 05:00", "theme": "demo-video", "kicker": "\u26a1 LIVE DEMO 1 \u00b7 MINUTE-ONE BUILD KICKOFF", "title": "Kick Off `/swarm` on Remote Agents \u2014 Close the Laptop!", "video": "../assets/videos/demo1_antigravity_swarm_kickoff.mp4", "poster": "../assets/videos/demo1_antigravity_swarm_kickoff_poster.png", "callouts": ["`agy --remote-agent` attaches `cmanikandan/gdg-blr-talk-nov14-2026` inside an isolated Google-managed VM", "`Orchestrator (Carbon)` writes `plan.md` & partitions exclusive file ownership across 3 `Hydrogen` workers", "Close the laptop lid on stage\u2014execution continues in the cloud with zero merge conflicts!"], "notes": "[02:15 - DEMO 1] Let's prove 'no slideware promises' right now in minute two! We attach Antigravity Remote Agents to our GitHub repo, pick Orchestrator (Carbon), and fire `/swarm` to build OmniPulse\u2014our multi-cloud incident & FinOps mesh. Watch Carbon lock the architecture plan, spawn three Hydrogen workers plus an adversarial cyber verifier, and boom\u2014I'm closing the terminal session! That cloud VM keeps building while we unpack the architecture."}, {"num": 4, "time": "05:00 \u2013 07:00", "theme": "head-first", "kicker": "MEET THE ELEMENTS \u00b7 GEMINI 4 + SPECIALISTS", "title": "The Periodic Table of Agents", "image": "../assets/infographics/02_hf_periodic_table.jpg", "bullets": ["\ud83e\uddea **The One-Model Trap:** Using a frontier model for everything burns quota; using a tiny model for architecture burns production.", "\ud83e\uddf1 **`[C]` Carbon (#6) & `[Ar]` Argon (#18):** Deep, long-horizon reasoning across 1M-token codebases & blueprints.", "\u26a1 **`[H]` Hydrogen (#1):** High-velocity everyday execution across 4 configurable thinking levels (`$1.50/1M`).", "\ud83c\udfaf **`[Dc]` Decision-1 & `[Lv]` Live 3.8:** 150ms calibrated routing (`$0` output!) + voice agents that reason while speaking."], "notes": "[05:00] Why did we call this talk The Periodic Table of Agents? Because chemistry works when elements bond according to their properties! Look at the Geek Bits box in the corner: Stop using Carbon to rename a CSS variable! When you split intelligence, speed, routing, and voice into five purpose-built elements, your latency drops by an order of magnitude and your accuracy actually goes UP."}, {"num": 5, "time": "07:00 \u2013 09:00", "theme": "dark-cards", "kicker": "PLAN BIG \u00b7 DEEP LONG-HORIZON REASONING", "title": "Carbon `[C]` & Argon `[Ar]`: The Frontier Architects", "cards": [{"badge": "ELEMENT #6 \u00b7 gemini-4-carbon", "heading": "Carbon: Frontier Intelligence & Cyber", "items": ["1M unified context + up to 1M output tokens", "#1 on CursorBench 4.0, WANDR & AutomationBench (>2x lower task cost)", "94% bug resolution on 14,000-test repos with ZERO regressions", "0% Indirect Prompt Injection success on Gray Swan IPI benchmark", "Fairwind Cyber + AlphaProof Code (Signal formal Lean proofs in weeks)"]}, {"badge": "ELEMENT #18 \u00b7 gemini-4-argon", "heading": "Argon: The Noble Daily Workhorse", "items": ["Rock-solid, non-reactive precision for 80% of complex engineering", "Same 1M context & built-in tool ecosystem ($2 in / $10 out intro)", "Ideal for multi-package microservices, SQL synthesis & diligence", "Pairs natively with Hydrogen in `Orchestrator (Argon)` mode", "Zero drama, predictable token budgets for enterprise teams"]}], "notes": "[07:00] Let's look under the hood of Carbon and Argon. Argon is your noble gas\u2014stable, reliable, crushes 80% of daily enterprise engineering. Carbon is what you bring out for multi-subsystem root-cause hunts, 900K-triangle 3D reconstructions, or cybersecurity audits\u2014hitting 0% indirect prompt injection on Gray Swan IPI and 94% bug resolution with zero regressions."}, {"num": 6, "time": "09:00 \u2013 10:30", "theme": "dark-cards", "kicker": "EXECUTE FAST \u00b7 SUB-SECOND EVERYDAY DISCIPLINE", "title": "Hydrogen `[H]`: Most Abundant Fuel in Your Agent Stack", "cards": [{"badge": "ELEMENT #1 \u00b7 gemini-4-hydrogen", "heading": "Why Hydrogen Changes the Math", "items": ["Adapted from Carbon: flat **$1.50 / $7.50** across full 1M context", "**2.5x faster** than 3.8 Flash \u00b7 **3.1x Terminal-Bench 4.1** (57% vs 18.2%)", "Natively batches parallel file-reads & ripgrep calls instead of serial loops", "**43/43** perfect score on PlotlyDataAnalyticsBench", "**99.9%** chain-of-thought legibility \u00b7 12x fewer shortcutting errors"]}, {"badge": "4 CONFIGURABLE THINKING LEVELS", "heading": "Dial Latency vs. Depth Per Call", "items": ["\ud83d\udfe2 `low`: Sub-second lint fixes, boilerplate, instant UI edits", "\ud83d\udd35 `medium`: Standard repo Q&A, test generation, doc synthesis", "\ud83d\udfe3 `high` (Default): **51 on AA Intelligence Index** (surpasses Argon's 50!)", "\ud83d\udd36 `xhigh`: **54 AA Index**\u2014frontier-grade surgical SWE-sweep repairs", "Pay and wait ONLY for the reasoning depth each step demands"]}], "notes": "[09:00] Hydrogen is the plot twist of November 2026! Adapted directly from Carbon, Hydrogen at its default `high` thinking tier actually scores 51 on the Artificial Analysis Intelligence Index\u2014edging past Argon's 50\u2014while running 2.5x faster than 3.8 Flash and batching parallel file reads natively. And with 4 thinking levels from `low` to `xhigh`, one model adapts to every worker track."}, {"num": 7, "time": "10:30 \u2013 12:30", "theme": "head-first", "kicker": "GOOGLE ANTIGRAVITY \u00b7 WIRING THE ELEMENTS TOGETHER", "title": "Orchestrator, `/swarm` & Remote Agents", "image": "../assets/infographics/03_hf_antigravity_architecture.jpg", "bullets": ["\ud83c\udfbc **Orchestrator:** Dynamically switches `Carbon` (Planner) \u2194 `Hydrogen` (Workers) mid-session \u2192 **-24% quota, +19% faster** on Terminal-Bench 4.0!", "\ud83d\udc1d **`/swarm` Message Board:** Named parallel workers in isolated git worktrees + an **Adversarial Verifier** challenging every diff.", "\ud83c\udfd7\ufe0f **`/teamwork` & `/boost`:** Multi-hour milestone handoffs (`Sentinel`) vs. deep multi-round algorithmic debugging.", "\u2601\ufe0f **Remote Agents (`agy --remote-agent`):** Isolated cloud VM + `agy-plugin-proxy` OAuth handles\u2014ships while your laptop sleeps."], "notes": "[10:30] How does Google Antigravity wire Carbon, Argon, and Hydrogen together without you babysitting model dropdowns? Three primitives: First, Orchestrator\u2014proven on Terminal-Bench 4.0 to match Carbon's success rate while saving 24% quota and finishing 19% faster. Second, `/swarm`\u2014isolated workspaces so two workers never stomp the same file, plus an adversarial Verifier. Third, Remote Agents!"}, {"num": 8, "time": "12:30 \u2013 14:00", "theme": "head-first", "kicker": "DECIDE SMALL \u00b7 LOW-LATENCY MULTIMODAL CONTROL PLANE", "title": "Gemini Decisions API (`gemini-decision-1`)", "image": "../assets/infographics/04_hf_decisions_api.jpg", "bullets": ["\ud83d\udeab **Stop Decoding Tokens to Route:** Waiting 2.4s for JSON text just to pick a tool or check PII kills agent UX.", "\u26a1 **Single Forward Pass (`150\u2013250ms` E2E):** Scores up to **1,000 independent questions** over text, images, audio, video & PDFs (256K ctx)!", "\ud83c\udf9b\ufe0f **3 Calibrated Primitives:** `noul` (Yes/No prob), `choice` (2\u2013255 options), `score` (ordered rubric 0..N).", "\ud83d\udcb8 **Unbeatable Economics:** **$0.10 / 1M input tokens** (billed once per shared input) and **$0.00 output tokens!**"], "notes": "[12:30] Now let's bring this exact multi-model pattern into YOUR production apps! How do you decide whether an in     function fmtMarkdown(s) {
      return s

        .replace(/\*(.+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');
    }

    function renderSlide() {
      const s = SLIDES[idx];
      const stage = document.getElementById('stage');
      let bodyHtml = '';

      if (s.theme === 'dark-hero') {
        const pills = s.pills.map(p => `<span class="hero-pill">${p}</span>`).join('');
        bodyHtml = `
          <div class="slide theme-dark-hero">
            <div class="kicker">${s.kicker}</div>
            <div class="hero-center">
              <div class="hero-title">${s.title}</div>
              <div class="hero-sub">${s.subtitle}</div>
              <div class="pill-row">${pills}</div>
            </div>
            <div class="slide-footer">
              <span>${s.footer_left}</span>
              <span>${s.footer_right}</span>
            </div>
          </div>`;
      } else if (s.theme === 'head-first') {
        const notesHtml = s.bullets.map(b => `<div class="hf-note">${fmtMarkdown(b)}</div>`).join('');
        bodyHtml = `
          <div class="slide theme-head-first">
            <div>
              <div class="kicker">${s.kicker}</div>
              <div class="slide-title">${fmtMarkdown(s.title)}</div>
            </div>

            <ul>${c.items.map(it => `<li>${fmtMarkdown(it)}</li>`).join('')}</ul>
          </div>

        bodyHtml = `

      stage.innerHTML = bodyHtml;
      document.getElementById('slide-counter').textContent = `${s.num} / ${SLIDES.length}`;
      document.getElementById('pacing-Slot').textContent = `Slot: ${s.time}`;

      document.getElementById('notes-text').textContent = s.notes;
    }

    function nextSlide() { if (idx < SLIDES.length - 1) { idx++; renderSlide(); } }
    function prevSlide() { if (idx > 0) { idx--; renderSlide(); } }
    function toggleNotes() { document.getElementById('notes-drawer').classList.toggle('open'); }
    function toggleFullscreen() {
      if (!document.fullscreenElement) document.documentElement.requestFullscreen();
      else document.exitFullscreen();
    }
    function toggleTimer() {
      const btn = document.getElementById('timer-btn');
      if (timerHandle) {
        clearInterval(timerHandle);
        timerHandle = null;
        return;
      }
      timerHandle = setInterval(() => {
        if (timerSec > 0) timerSec--;
        const m = String(Math.floor(timerSec / 60)).padStart(2, '0');
        const s = String(timerSec % 60).padStart(2, '0');
        btn.textContent = `⏱️ ${m}:${s}`;
      }, 1000);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); nextSlide(); }
      if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
      if (e.key.toLowerCase() === 's') toggleNotes();
      if (e.key.toLowerCase() === 'f') toggleFullscreen();
    });

    renderSlide();
  </script>
